services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_business
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_business"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  analytics-service:
    build:
      context: ./analytics-service
    env_file:
      - path: ./analytics-service/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_business
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_business
      REDIS_URL: redis://redis:6379
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      FRONTEND_URL: http://localhost:5174
      PORT: "5001"
      NODE_ENV: development
      ACCESS_TOKEN_SECRET: docker-demo-access-token-secret-min-32-chars
      REFRESH_TOKEN_SECRET: docker-demo-refresh-token-secret-min-32-ch
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      COOKIE_SECURE: "false"
    ports:
      - "5002:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5002
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  postgres_data:
